<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Comunidades – Maceió</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-geometryutil@0.10.0/src/leaflet.geometryutil.js"></script>
</head>
<body>

<header>
    Mapa de Comunidades – Maceió
</header>

<div id="container">

    <div id="sidebar">
        <h3>Filtros</h3>

        <select id="areaSelect">
            <option value="">Selecione uma área</option>
        </select>

        <button id="btnGrotaNoGrau" class="btn btn-success">
            Filtrar Grota no Grau
        </button>

        <button id="btnLimparFiltros" class="btn btn-danger">
            Limpar filtros
        </button>
    </div>

    <div id="map-container">

        <!-- CARDS -->
        <div id="info-cards">
            <div class="card">
                <span class="label">Comunidade</span>
                <span id="info-nome" class="value">—</span>
            </div>

            <div class="card">
                <span class="label">População (IBGE)</span>
                <span id="info-populacao" class="value">—</span>
            </div>

            <div class="card">
                <span class="label">Domicílios (IBGE)</span>
                <span id="info-domicilios" class="value">—</span>
            </div>

            <div class="card">
                <span class="label">Área (km²)</span>
                <span id="info-area" class="value">—</span>
            </div>
        </div>

        <div id="map"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
</body>
</html>
