<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Comunidades – Maceió</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>Mapa de Comunidades – Maceió</header>

<div id="container">

    <aside id="sidebar">
        <h3>Filtros</h3>

        <select id="areaSelect">
            <option value="">Selecione uma área</option>
        </select>

        <button id="btnGrotaNoGrau">Filtrar Grota no Grau</button>
        <button id="btnAbairramento">Mostrar Abairramento</button>
        <button id="btnLimparFiltros">Limpar filtros</button>
    </aside>

    <main id="map-container">

        <div id="info-cards">
            <div class="card"><span>Comunidade</span><strong id="info-nome">—</strong></div>
            <div class="card"><span>População</span><strong id="info-populacao">—</strong></div>
            <div class="card"><span>Domicílios</span><strong id="info-domicilios">—</strong></div>
            <div class="card"><span>Área (km²)</span><strong id="info-area">—</strong></div>
        </div>

        <div id="map"></div>

    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
</body>
</html>
